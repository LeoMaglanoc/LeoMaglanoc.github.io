services:
  drone-site:
    image: python:3.10-slim
    working_dir: /workspace
    command: ["python", "-m", "http.server", "8001", "--directory", "/workspace"]
    ports: ["8001:8001"]
    volumes: ["../../..:/workspace:ro"]
  drone-tools:
    build: .
    working_dir: /workspace/assets/interactive/drone-racing
    volumes: ["../../..:/workspace"]
    environment:
      DRONE_URL: http://drone-site:8001/assets/interactive/drone-racing/
      G1_URL: http://drone-site:8001/assets/interactive/g1/
