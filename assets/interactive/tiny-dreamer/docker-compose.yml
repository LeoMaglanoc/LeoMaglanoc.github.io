services:
  trainer:
    build: .
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ../../..:/repo:ro
    command: python -m pytest -q
  website:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ../../..:/site:ro
    command: python -m http.server 4000 --bind 0.0.0.0
    ports:
      - "4000:4000"
  built-website:
    image: python:3.11-slim
    working_dir: /site/_site
    volumes:
      - ../../..:/site:ro
    command: python -m http.server 4000 --bind 0.0.0.0
  browser:
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      DREAMER_URL: http://website:4000/assets/interactive/tiny-dreamer/index.html
    depends_on:
      - website
    command: sh -c "npm ci && npm test"
