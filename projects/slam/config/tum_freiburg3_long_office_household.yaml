dataset: freiburg3_long_office_household
camera:
  width: 640
  height: 480
  fx: 535.4
  fy: 539.2
  cx: 320.1
  cy: 247.6
  depth_scale: 5000.0
  depth_trunc: 5.0
tsdf:
  voxel_length: 0.03
  sdf_trunc: 0.06
  frame_stride: 2
association:
  max_rgb_depth_difference_s: 0.02
  max_pose_difference_s: 0.02
web_export:
  simplify: true
  target_triangles: 250000
rtabmap_textured_mesh:
  # Native RTAB-Map mesh reconstruction. These intentionally favor wall and
  # furniture boundaries before web-size tuning; the UV-textured master stays
  # separate from the browser GLB.
  poisson_size_m: 0.02
  max_polygons: 350000
  min_cluster: 500
  min_range_m: 0.3
  max_range_m: 5.0
  decimation: 2
  voxel_m: 0.01
  # RTAB-Map's edge-bleeding path clears the compressed RGB handle before its
  # texture-camera collection pass, so leave this at zero for native UV export.
  edge_bleeding_error_m: 0.0
  texture_size: 4096
  texture_count: 2
  texture_range_m: 4.0
  texture_angle_deg: 75
  texture_depth_error_m: 0.03
  texture_blur: 50
  gain: 1
  low_gain: 0
  high_gain: 10
