services:
  slam:
    build:
      context: .
      dockerfile: Dockerfile
    image: offline-slam:jazzy
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      PYTHONPATH: /workspace/src
    stdin_open: true
    tty: true

  android:
    build:
      context: .
      dockerfile: AndroidDockerfile
    image: offline-slam:android
    working_dir: /workspace/android
    volumes:
      - .:/workspace
    stdin_open: true
    tty: true

  web:
    image: node:22-bookworm-slim
    working_dir: /workspace/web
    volumes:
      - .:/workspace
      - phone_slam_web_node_modules:/workspace/web/node_modules

volumes:
  phone_slam_web_node_modules:
