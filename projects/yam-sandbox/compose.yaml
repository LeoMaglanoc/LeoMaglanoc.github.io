services:
  lab:
    image: yam-sandbox:lab
    working_dir: /work
    volumes:
      - .:/work
    command: python tools/evaluate.py
  web:
    image: python:3.12-slim@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1
    working_dir: /site
    volumes:
      - ../..:/site:ro
    ports:
      - "8000:8000"
    command: python -m http.server 8000
