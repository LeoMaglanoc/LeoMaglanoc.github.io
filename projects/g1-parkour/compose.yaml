services:
  tools:
    image: node:22-bookworm-slim
    working_dir: /work/projects/g1-parkour
    volumes:
      - ../..:/work
    command: sh -c 'npm ci && npm test && npm run build:web && node scripts/publish.cjs'
  preview:
    image: nginx:1.27-alpine
    ports:
      - '127.0.0.1:8096:80'
    volumes:
      - ../..:/usr/share/nginx/html:ro
      - ../../scripts/nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
