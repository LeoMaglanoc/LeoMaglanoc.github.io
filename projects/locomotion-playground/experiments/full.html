<!doctype html><meta charset="utf-8"><title>Upstream whole-body MPC WASM validation</title><h1>Whole-body MPC worker validation</h1><p id="status">Loading upstream B2+Z1 solver…</p><button id="run" disabled>Run 3 consecutive solves</button><pre id="result"></pre><script type="module">
const worker=new Worker('../mpc/worker.js',{type:'module'}),status=document.getElementById('status'),button=document.getElementById('run'),result=document.getElementById('result');let results=[],q,v,fixture;
const c=await(await fetch('../mpc/deployment.json')).json();q=c.q0;v=new Array(22).fill(0);fixture=await(await fetch('../mpc/native-fixture.json')).json();
worker.onmessage=({data})=>{if(data.type==='ready'){status.textContent=`Ready · setup ${data.setupTimeMs.toFixed(0)} ms`;button.disabled=false;return;}if(data.type==='error'){status.textContent='FAIL';result.textContent=JSON.stringify(data,null,2);button.disabled=false;return;}if(data.type==='solved'){const r=data.result;results.push({solveMs:r.solveTimeMs,violation:r.constraintViolation,torque:r.torque,maxNativeTorqueError:Math.max(...r.torque.map((x,i)=>Math.abs(x-fixture.decoded[675+i])))});result.textContent=JSON.stringify(results,null,2);if(results.length<3)solve();else{status.textContent='PASS: 3 full whole-body Fatrop solves in Web Worker';button.disabled=false;}}};
function solve(){worker.postMessage({type:'solve',id:results.length,state:{q,v,time:0,command:[.1,0,0],gait:'trot',backend:'fatrop'}});}button.onclick=()=>{results=[];button.disabled=true;status.textContent='Solving…';worker.postMessage({type:'reset'});solve();};worker.postMessage({type:'init',backend:'fatrop'});
</script>
