services:
  tools:
    image: node:22-bookworm-slim
    working_dir: /work/projects/portal-puzzle-lab
    volumes:
      - ../..:/work
    command: sh -c "npm ci && npm run vendor && npm test"
  preview:
    image: nginx:1.27-alpine
    ports:
      - "8098:80"
    volumes:
      - ../../_site:/usr/share/nginx/html:ro
      - ../../scripts/nginx-preview.conf:/etc/nginx/conf.d/default.conf:ro
