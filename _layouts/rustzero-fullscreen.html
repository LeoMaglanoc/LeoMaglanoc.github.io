    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <meta
      name="description"
      content="Play RustZero: a Rust AlphaZero-style agent that learns 6×6 Breakthrough through self-play, with live MCTS statistics and measured training progress."
