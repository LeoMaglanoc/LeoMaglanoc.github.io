<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111b23" />
    <meta
      name="description"
      content="Connect two portals, retrieve a cube and escape an original 3D puzzle chamber. Play on desktop or touch screens."
    />
    <link rel="icon" href="data:," />
    <title>{{ page.title | escape }}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111b23;
      }
      .demo-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
