<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101819" />
    <meta
      name="description"
      content="Interactive dexterous reinforcement learning: rotate a target cube and watch a Wuji robotic hand follow in live browser physics."
    />
    <title>{{ page.title | escape }}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #101819;
      }
      .demo-frame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
