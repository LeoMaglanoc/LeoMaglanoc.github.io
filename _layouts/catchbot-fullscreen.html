<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="{{ '/assets/img/favicon/favicon.ico' | relative_url }}" />
    <meta name="theme-color" content="#0a121d" />
    <meta
      name="description"
      content="Outrun a two-joint robot with reactive or predictive pursuit. CatchBot runs locally in your browser."
    />
    <title>{{ page.title | escape }}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0a121d;
        overflow: hidden;
      }
      iframe {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
