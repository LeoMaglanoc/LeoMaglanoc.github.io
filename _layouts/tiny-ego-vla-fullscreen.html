<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2eb" />
    <meta name="description" content="TinyEgoVLA: a CPU-scale experiment in egocentric pretraining and Panda robot adaptation." />
    <title>{{ page.title | escape }}</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f5f2eb;
      }
      iframe {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    {{ content }}
  </body>
</html>
