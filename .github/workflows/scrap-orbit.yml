name: Scrap Orbit
on:
  push:
    paths:
      [
        "projects/scrap-orbit/**",
        "assets/interactive/scrap-orbit/**",
        "_pages/scrap-orbit.md",
        "_layouts/scrap-orbit-fullscreen.html",
        ".github/workflows/scrap-orbit.yml",
      ]
  pull_request:
    paths:
      [
        "projects/scrap-orbit/**",
        "assets/interactive/scrap-orbit/**",
        "_pages/scrap-orbit.md",
        "_layouts/scrap-orbit-fullscreen.html",
        ".github/workflows/scrap-orbit.yml",
      ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish browser project assets
        run: python3 scripts/publish-project-assets.py
      - name: Build pinned Godot tools
        run: docker compose -f projects/scrap-orbit/docker-compose.yml build tools
      - name: Rebuild web export
        run: docker compose -f projects/scrap-orbit/docker-compose.yml run --rm tools ./scripts/build_web.sh
      - name: Validate physics, layouts, input and progression
        run: docker compose -f projects/scrap-orbit/docker-compose.yml run --rm tools ./scripts/validate.sh
      - name: Browser playthroughs
        run: projects/scrap-orbit/scripts/test_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scrap-orbit-browser
          path: projects/scrap-orbit/artifacts/browser/
      - name: Stop preview containers
        if: always()
        run: docker compose -f projects/scrap-orbit/docker-compose.yml down
