name: TinyDreamer regressions
on:
  pull_request:
    paths: ["projects/tiny-dreamer/**", "projects/g1/vendor/**", "projects/doom/vendor/ort/**", "_pages/tiny-dreamer.md", "_layouts/tiny-dreamer-fullscreen.html", ".github/workflows/tiny-dreamer.yml"]
  push:
    paths: ["projects/tiny-dreamer/**", "projects/g1/vendor/**", "projects/doom/vendor/ort/**", "_pages/tiny-dreamer.md", "_layouts/tiny-dreamer-fullscreen.html", ".github/workflows/tiny-dreamer.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Publish browser project assets
        run: python3 scripts/publish-project-assets.py
      - name: Build CPU Docker environment
        run: docker compose -f projects/tiny-dreamer/docker-compose.yml build trainer
      - name: Environment, learning and export contracts
        run: docker compose -f projects/tiny-dreamer/docker-compose.yml run --rm trainer python -m pytest -q
      - name: Local runtime, physics parity, swing-up and mobile controls
        run: |
          docker compose -f projects/tiny-dreamer/docker-compose.yml up -d website
          docker compose -f projects/tiny-dreamer/docker-compose.yml run --rm browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tiny-dreamer-validation
          path: |
            projects/tiny-dreamer/artifacts/browser-results.json
            projects/tiny-dreamer/artifacts/*.png
      - name: Stop preview services
        if: always()
        run: docker compose -f projects/tiny-dreamer/docker-compose.yml down
