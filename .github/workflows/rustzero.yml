name: RustZero checks
on:
  push:
    paths: ["projects/rustzero/**", ".github/workflows/rustzero.yml"]
  pull_request:
    paths: ["projects/rustzero/**", ".github/workflows/rustzero.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-and-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Docker toolchain
        working-directory: projects/rustzero
        run: docker compose build
      - name: Rules, search, training and checkpoint tests
        working-directory: projects/rustzero
        run: docker compose run --rm rustzero cargo test --locked --release --features training -j 3
      - name: Check formatting
        working-directory: projects/rustzero
        run: docker compose run --rm rustzero cargo fmt --check
      - name: Strict Clippy
        working-directory: projects/rustzero
        run: docker compose run --rm rustzero cargo clippy --locked --release --features training --all-targets -- -D warnings
      - name: Validate published provenance
        working-directory: projects/rustzero
        run: sh scripts/validate-published-run.sh
      - name: Tiny self-play, checkpoint and arena smoke
        working-directory: projects/rustzero
        run: |
          docker compose run --rm rustzero cargo run --locked --release --features training --bin train -- configs/smoke.toml artifacts/ci-smoke
          docker compose run --rm rustzero cargo run --locked --release --features training --bin arena -- artifacts/ci-smoke/champion.json 2 8 artifacts/ci-smoke/arena.json
          docker compose run --rm rustzero cargo run --locked --release --features training --bin fixture -- artifacts/ci-smoke/champion.json artifacts/ci-smoke/inference-fixture.json
      - name: Rebuild shared Rust core for WebAssembly
        working-directory: projects/rustzero
        run: docker compose run --rm rustzero sh scripts/build-web.sh
      - name: Native checkpoint inference fixture
        working-directory: projects/rustzero
        run: docker compose run --rm rustzero cargo run --locked --release --features training --bin fixture -- web/models/final.json web/metrics/inference-fixture.json
      - name: Verify native/WASM agreement and complete WASM game
        run: docker run --rm -v "$PWD/projects/rustzero:/work" -w /work node:22-bookworm-slim sh -c 'node scripts/check-wasm.mjs && node scripts/check-worker.mjs && node scripts/check-wasm.mjs artifacts/ci-smoke/champion.json artifacts/ci-smoke/inference-fixture.json'
