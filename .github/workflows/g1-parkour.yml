name: G1 parkour contracts and browser
on:
  push:
    paths: ['projects/g1-parkour/**', 'assets/interactive/g1-parkour/**', '_pages/parkour.md', '_layouts/parkour-fullscreen.html', '_plugins/preserve-parkour-assets.rb', '.github/workflows/g1-parkour.yml']
  pull_request:
    paths: ['projects/g1-parkour/**', 'assets/interactive/g1-parkour/**', '_pages/parkour.md', '_layouts/parkour-fullscreen.html', '_plugins/preserve-parkour-assets.rb', '.github/workflows/g1-parkour.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate released contracts and build with Docker
        run: docker compose -f projects/g1-parkour/compose.yaml run --rm tools
      - name: Start static preview
        run: docker compose -f projects/g1-parkour/compose.yaml up -d preview
      - name: Build browser test environment
        run: docker build -f projects/g1-parkour/Dockerfile.browser -t g1-parkour-browser projects/g1-parkour
      - name: Startup and unsupported depth-GPU handling
        run: docker run --rm --network host -v "$PWD":/work g1-parkour-browser node tests/startup.cjs
      - name: Desktop and phone touch integration
        run: docker run --rm --network host -v "$PWD":/work g1-parkour-browser
      - name: Touch camera gestures and reset resource reuse
        run: docker run --rm --network host -v "$PWD":/work g1-parkour-browser node tests/gestures.cjs
      - name: Sensor material parity and long closed-loop probe
        run: docker run --rm --network host -v "$PWD":/work g1-parkour-browser node tests/course.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parkour-browser-evidence
          path: projects/g1-parkour/results/
      - name: Stop preview
        if: always()
        run: docker compose -f projects/g1-parkour/compose.yaml down
