name: Dustfall Outpost
on:
  pull_request:
    paths: ["projects/dustfall-outpost/**", "assets/interactive/dustfall-outpost/**", "_pages/dustfall-outpost.md", "_layouts/dustfall-fullscreen.html", ".github/workflows/dustfall-outpost.yml"]
  push:
    paths: ["projects/dustfall-outpost/**", "assets/interactive/dustfall-outpost/**", "_pages/dustfall-outpost.md", "_layouts/dustfall-fullscreen.html", ".github/workflows/dustfall-outpost.yml"]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Publish browser project assets
        run: python3 scripts/publish-project-assets.py
      - name: Build pinned tool image
        run: docker compose -f projects/dustfall-outpost/docker-compose.yml build tools
      - name: Regenerate, export and validate
        run: docker compose -f projects/dustfall-outpost/docker-compose.yml run --rm tools ./scripts/validate.sh
      - name: Browser and multi-touch checks
        run: projects/dustfall-outpost/scripts/test_browser.sh
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dustfall-browser
          path: projects/dustfall-outpost/artifacts/
      - name: Stop preview
        if: always()
        run: docker compose -f projects/dustfall-outpost/docker-compose.yml down
