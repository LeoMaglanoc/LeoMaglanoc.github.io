name: Robot World
on:
  push:
    paths:
      [
        "games/block-world/**",
        "assets/interactive/block-world/**",
        "_pages/block-world.md",
        "_layouts/block-world-fullscreen.html",
        ".github/workflows/block-world.yml",
      ]
  pull_request:
    paths:
      [
        "games/block-world/**",
        "assets/interactive/block-world/**",
        "_pages/block-world.md",
        "_layouts/block-world-fullscreen.html",
        ".github/workflows/block-world.yml",
      ]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Godot tools
        run: docker compose -f games/block-world/docker-compose.yml build tools
      - name: Rebuild web export
        run: docker compose -f games/block-world/docker-compose.yml run --rm tools ./scripts/build_web.sh
      - name: Validate terrain, player and robot mechanics
        run: docker compose -f games/block-world/docker-compose.yml run --rm tools ./scripts/validate.sh
      - name: Browser playthroughs
        run: games/block-world/scripts/test_browser.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: block-world-browser
          path: games/block-world/artifacts/browser/
      - name: Stop preview containers
        if: always()
        run: docker compose -f games/block-world/docker-compose.yml down
