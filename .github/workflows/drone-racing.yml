name: Drone racing regressions
on:
  pull_request:
    paths: ["projects/drone-racing/**", ".github/workflows/drone-racing.yml"]
  push:
    paths: ["projects/drone-racing/**", ".github/workflows/drone-racing.yml"]
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish browser project assets
        run: python3 scripts/publish-project-assets.py
      - name: Build Docker tooling
        run: docker compose -f projects/drone-racing/docker-compose.yml build drone-tools
      - name: Validate offline trajectory and flight control
        run: |
          docker compose -f projects/drone-racing/docker-compose.yml run --rm drone-tools python3 tools/generate_trajectory.py
          git diff --exit-code -- projects/drone-racing/trajectories/race_v1.json
          docker compose -f projects/drone-racing/docker-compose.yml run --rm drone-tools python3 tools/validate_trajectory.py
          docker compose -f projects/drone-racing/docker-compose.yml run --rm drone-tools node --test tests/*.test.js
          docker compose -f projects/drone-racing/docker-compose.yml run --rm drone-tools node tools/benchmark_controller.js
      - name: Desktop and mobile Chromium regressions
        run: |
          docker compose -f projects/drone-racing/docker-compose.yml up -d drone-site
          docker compose -f projects/drone-racing/docker-compose.yml run --rm drone-tools node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drone-racing-browser-results
          path: projects/drone-racing/artifacts/
      - name: Stop Docker services
        if: always()
        run: docker compose -f projects/drone-racing/docker-compose.yml down
