  - id: ask_leo
    type: assistant
    title: Ask Leo
    summary: A local portfolio assistant that retrieves from this curated public knowledge base and generates answers in the visitor's browser.
    facts:
      - Uses deterministic local retrieval over public portfolio records.
      - Runs a small model through Transformers.js with WebGPU when supported.
      - Does not send questions to an LLM API or server.
