featured_projects:
  - title: SO-101 Robot Learning and Foundation Models
    description: "End-to-end visuomotor policy learning on a physical SO-101 manipulator. Built the full imitation-learning pipeline with LeRobot: teleoperation, dataset collection, ACT and SmolVLA training, and real-robot policy deployment."
    links: []

  - title: "MSc Thesis at a Robotics Startup: Lang2Tool"
    description: "Language-guided tool-motion generation for dexterous manipulation. Grounds natural-language instructions in parameterized SE(3) motion primitives, combining LLM-level reasoning with a learned low-level policy."
    links:
      - label: Github
        url: https://github.com/LeoMaglanoc/lang2tool 
      - label: startup
        url: https://foundation.bot/ 

  - title: Neuromorphic Computing at BMW Research
    description: "Neuro-inspired computing with Oscillatory Neural Networks in collaboration with IBM. Built Python/PyTorch simulators and collected tactile interaction data from 10 participants for a human-machine interaction demonstrator."
    links:
      - label: EU project
        url: https://phastrac.eu/

  - title: Safe Human-Robot Collaboration at TUM
    description: "Runtime safety for physical human-robot interaction using reachability analysis and verification. Contributed to SaRA-Shield, providing formal safety guarantees for autonomous manipulation; published in IEEE Transactions on Robotics."
    links:
      - label: paper
        url: https://ieeexplore.ieee.org/abstract/document/11575118
      - label: demo
        url: https://youtu.be/IUAeZGau28E?si=0zWlQfw3i6It8nDD

